name: Build Home Assistant QNAP 32K

on:
  workflow_dispatch:
    inputs:
      ha_version:
        description: 'Versão do Home Assistant (ex: 2026.2.2 ou latest)'
        required: false
        default: 'latest'
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  schedule:
    # Executa semanalmente (domingo às 03:00 UTC) para manter a imagem sempre atualizada
    - cron: '0 3 * * 0'

jobs:
  build:
    name: Build & Push (linux/arm/v7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU (ARMv7)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determinar Versão do Home Assistant
        id: vars
        run: |
          VERSION="${{ github.event.inputs.ha_version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            LATEST_HA=$(curl -s https://pypi.org/pypi/homeassistant/json | jq -r .info.version)
            if [ -n "$LATEST_HA" ] && [ "$LATEST_HA" != "null" ]; then
              VERSION="$LATEST_HA"
            else
              VERSION="latest"
            fi
          fi
          echo "target_version=$VERSION" >> $GITHUB_OUTPUT
          # Converte o repositório para minúsculas para cumprir o padrão de tags Docker
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/homeassistant-qnap-32k" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: true
          build-args: |
            HA_VERSION=${{ steps.vars.outputs.target_version }}
          tags: |
            ${{ env.image_repo }}:${{ steps.vars.outputs.target_version }}
            ${{ env.image_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
