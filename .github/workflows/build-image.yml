name: Build Home Assistant QNAP 32K

on:
  workflow_dispatch:
    inputs:
      ha_version:
        description: 'Versão do Home Assistant (deixe latest para a mais recente compatível)'
        required: false
        default: 'latest'
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  schedule:
    # Executa semanalmente aos domingos às 03:00 UTC
    - cron: '0 3 * * 0'

jobs:
  build:
    name: Build & Push (linux/arm/v7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU (ARMv7)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determinar Versão do Home Assistant
        id: vars
        run: |
          VERSION="${{ github.event.inputs.ha_version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            # Descobre dinamicamente a versão estável mais recente compatível com Python 3.13
            VERSION=$(python3 -c "import urllib.request, json; data = json.loads(urllib.request.urlopen('https://pypi.org/pypi/homeassistant/json').read()); print([v for v in reversed(list(data['releases'].keys())) if data['releases'][v] and '3.14' not in (data['releases'][v][0].get('requires_python') or '') and '3.15' not in (data['releases'][v][0].get('requires_python') or '') and v.startswith('202') and 'b' not in v][0])")
            if [ -z "$VERSION" ]; then
              VERSION="2026.2.3"
            fi
          fi
          echo "target_version=$VERSION" >> $GITHUB_OUTPUT
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/homeassistant-qnap-32k" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Versao selecionada para instalacao: $VERSION"

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: true
          build-args: |
            HA_VERSION=${{ steps.vars.outputs.target_version }}
          tags: |
            ${{ env.image_repo }}:${{ steps.vars.outputs.target_version }}
            ${{ env.image_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
