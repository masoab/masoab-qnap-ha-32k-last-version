name: Build Home Assistant (QNAP armv7)

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      ha_version:
        description: "Versão do HA (vazio = mais recente compatível)"
        required: false
        default: ""
  push:
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/homeassistant-qnap

    steps:
      - uses: actions/checkout@v4

      - name: Descobrir versão do HA compatível com Python 3.13
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.ha_version }}" ]; then
            echo "version=${{ github.event.inputs.ha_version }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pip install -q packaging
          V=$(python - <<'PY'
          import json, urllib.request
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version
          d = json.load(urllib.request.urlopen("[pypi.org](https://pypi.org/pypi/homeassistant/json)"))
          ok = []
          for ver, files in d["releases"].items():
              if not files: continue
              try: v = Version(ver)
              except Exception: continue
              if v.is_prerelease: continue
              rp = files[0].get("requires_python") or ""
              if not rp or Version("3.13.0") in SpecifierSet(rp):
                  ok.append(v)
          print(max(ok))
          PY
          )
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versão escolhida: $V"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          platforms: linux/arm/v7
          push: true
          provenance: false
          sbom: false
          build-args: |
            HA_VERSION=${{ steps.ver.outputs.version }}
            STRICT_ALIGN=1
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=registry,oci-mediatypes=false

